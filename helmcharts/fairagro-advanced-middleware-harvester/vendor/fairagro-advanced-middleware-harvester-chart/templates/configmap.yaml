apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "harvester.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "harvester.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- $config := deepCopy .Values.config }}
    {{- /* Map rdi_catalog (enabled entries) → config.repositories list. */}}
    {{- $parsed := include "harvester.repositoriesFromCatalog" . | fromJson }}
    {{- $_ := set $config "repositories" $parsed.items }}
    {{- toYaml $config | nindent 4 }}
