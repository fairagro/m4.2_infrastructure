# Local kind deployment values for the advanced middleware API.
# Default: same published image tag as fizz. For a deps/ build, set
# repository/tag/pullPolicy: Never as noted under api.image.

# Skip cert-manager Issuer + Cloudflare secret templates in the umbrella chart
# (templates render only when tls.key / tls.crt are unset).
tls:
  key: local-dev-unused
  crt: local-dev-unused

fairagro-advanced-middleware-api-chart:
  config:
    log_level: DEBUG
    known_rdis:
      - bonares
      - dwd
      - edal
      - edaphobase
      - openagrar
      - publisso
      - thunen_atlas
    # Nested ArcStore (issue #334): no top-level git_repo.
    # Point at a reachable Datahub when testing against real data, or keep
    # placeholders and exercise API-only paths. Token via env/secret if needed.
    arc_store:
      git:
        max_workers: 2
      git_repo:
        url: https://datahub.ipk-gatersleben.de
        group: FAIRagro-advanced-middleware-test
        rdi_gitlab_topics:
          bonares: bonares
          dwd: DWD
          edal: "e!DAL"
          edaphobase: edaphobase
          openagrar: "OpenAgrar Repository"
          publisso: Publisso
          thunen_atlas: "Thunen Atlas"
    celery: {}
    otel:
      endpoint: null
      log_level: INFO
    require_client_cert: false

  rabbitmq:
    image: rabbitmq:4.3.4-alpine
    auth:
      username: fairagro
      password: fairagro-local
      erlang_cookie: fairagro-local-cookie

  couchdb:
    image: couchdb:3.5.2.1
    auth:
      username: fairagro
      password: fairagro-local
    persistence:
      enabled: false

  api:
    replicaCount: 1
    image:
      # Same release as fizz (nested arc_store / dual-slot). Override to
      # repository: fairagro-advanced-middleware-api / tag: local / pullPolicy: Never
      # when loading a kind-built image from deps/.
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      mtlsEnabled: false
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
      hosts:
        - host: middleware.localtest.me
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []

  celery:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
      pullPolicy: IfNotPresent
    worker:
      replicaCount: 1
      concurrency: 1
      persistence:
        size: 1Gi
