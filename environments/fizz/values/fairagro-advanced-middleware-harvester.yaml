fairagro-advanced-middleware-harvester-chart:
  schedule: 0 2 * * *
  image:
    tag: 4.0.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  config:
    log_level: INFO
    otel:
      endpoint: null
      log_console_spans: false
      log_level: INFO
    api_client:
      api_url: https://middleware-test.fairagro.net
      timeout: 30.0
      max_concurrency: 10
      max_retries: 3
  rdi_catalog:
    publisso:
      enabled: true
    bonares:
      enabled: true
      inspire:
        csw_url: https://repository-e.dataservice.zalf.de/catalogue/csw
    thunen_atlas:
      enabled: true
    edal:
      enabled: true
    dwd:
      enabled: true
    sradi:
      enabled: true
    plabipd:
      enabled: true
    phenorob:
      enabled: true
