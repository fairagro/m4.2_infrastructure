fairagro-advanced-middleware-api-chart:
  config:
    log_level: INFO
    known_rdis:
      - id: bonares
      - id: dwd
      - id: edal
      - id: edaphobase
      - id: openagrar
      - id: publisso
      - id: thunen_atlas
    # Dual-slot ArcStore (issue #517 hard cut):
    # - required arc_store: per-ARC git_repo (backend selected by nested key, no type)
    # - consolidated_store omitted on elise until a catalog repo exists (#130 / 4B)
    # Token: fairagro-advanced-middleware.enc.yaml → arc_store.git.token
    arc_store:
      git_repo:
        url: https://datahub-dev.ipk-gatersleben.de
        group: FAIRagro-advanced-middleware-dev
        rdi_gitlab_topics:
          bonares: bonares
          dwd: DWD
          edal: "e!DAL"
          edaphobase: edaphobase
          openagrar: "OpenAgrar Repository"
          publisso: Publisso
          thunen_atlas: "Thunen Atlas"
    celery: {}  # all further celery config is set via environment variables
    otel: {}

  rabbitmq:
    image: rabbitmq:4.3.4-alpine

  couchdb:
    image: couchdb:3.5.2.1
    persistence:
      enabled: true
      size: 5Gi

  api:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 15.0.0
    ingress:
      # Dual-path with Gateway during trial (#130); disable after live client-TLS check.
      enabled: true
      mtlsEnabled: true
      mtlsVerifyDepth: 3
      className: nginx-external
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        cert-manager.io/issuer: letsencrypt
        cert-manager.io/private-key-size: "4096"
        cert-manager.io/private-key-rotation-policy: "Always"
        # It seems the subjects annotations do not have any effect.
        # Still we keep them...
        cert-manager.io/subject-countries: "DE"
        cert-manager.io/subject-organizations: "NFDI FAIRagro"
        cert-manager.io/subject-organizationalunits: "Measure 4.2"
      hosts:
        - host: middleware-dev.fairagro.net
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: server-tls
          hosts:
            - middleware-dev.fairagro.net
    httpRoute:
      enabled: true
      # Cluster ListenerSet CRD is gateway.networking.k8s.io/v1 (not x-k8s.io chart default).
      # Match working Elise routes (argocd/longhorn): stable group + sectionName https.
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: ListenerSet
          name: fairagro-https
          namespace: kube-gateway-api
          sectionName: https
      hostnames:
        - middleware-dev.fairagro.net
      clientTls:
        enabled: true
        project: fairagro-m42
        verifyDepth: 3

  celery:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 15.0.0
    worker:
      replicaCount: 2
      concurrency: 2
      persistence:
        size: 4Gi # for temporary files during processing
