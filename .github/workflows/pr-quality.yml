# PR quality gates for main → fizz auto-deploy (#46).
# Check names below are listed in docs/ops/pr-quality-gates.md for ruleset "required checks".
name: pr-quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  helm-template-matrix:
    name: helm-template-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1
      - name: Install kubeconform
        run: sudo PINNED_TOOL_INSTALL_DIR=/usr/local/bin bash scripts/install-pinned-tool.sh kubeconform
      - name: Helm template fizz+draven matrix (+ leaf kubeconform)
        run: ./scripts/ci_helm_template_matrix.sh

  argocd-yaml-parse:
    name: argocd-yaml-parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Parse environments/*/argocd/*.yaml
        run: ./scripts/ci_validate_argocd_yaml.sh

  # draven pins: always-on workflow check-draven-pins.yml (same gate, single check name)

  # Single hygiene job so the ruleset needs one check name (#96), not one per linter.
  infra-quality:
    name: infra-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      - name: Install gitleaks
        run: sudo PINNED_TOOL_INSTALL_DIR=/usr/local/bin bash scripts/install-pinned-tool.sh gitleaks
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact
      - name: Run shellcheck on scripts/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: warning
      - name: Install actionlint
        run: sudo PINNED_TOOL_INSTALL_DIR=/usr/local/bin bash scripts/install-pinned-tool.sh actionlint
      - name: Lint GitHub Actions workflows
        run: actionlint
