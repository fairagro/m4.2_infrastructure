fairagro-advanced-middleware-api-chart:
  config:
    log_level: INFO
    known_rdis:
      - bonares
      - dwd
      - edal
      - edaphobase
      - openagrar
      - publisso
      - thunen_atlas
    # Nested ArcStore (issue #334): no top-level git_repo.
    # Token: fairagro-advanced-middleware.enc.yaml → arc_store.git.token
    arc_store:
      git:
        max_workers: 4
      git_repo:
        url: https://datahub-dev.ipk-gatersleben.de
        group: FAIRagro-advanced-middleware-dev
    celery: {}  # all further celery config is set via environment variables
    otel: {}

  rabbitmq:
    image: rabbitmq:4.3.4-alpine

  couchdb:
    image: couchdb:3.5.2.1
    persistence:
      enabled: true
      size: 5Gi

  api:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
    ingress:
      enabled: true
      mtlsEnabled: true
      mtlsVerifyDepth: 3
      className: nginx-external
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        cert-manager.io/issuer: letsencrypt
        cert-manager.io/private-key-size: "4096"
        cert-manager.io/private-key-rotation-policy: "Always"
        # It seems the subjects annotations do not have any effect.
        # Still we keep them...
        cert-manager.io/subject-countries: "DE"
        cert-manager.io/subject-organizations: "NFDI FAIRagro"
        cert-manager.io/subject-organizationalunits: "Measure 4.2"
      hosts:
        - host: middleware-dev.fairagro.net
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: server-tls
          hosts:
            - middleware-dev.fairagro.net

  celery:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
    worker:
      replicaCount: 2
      concurrency: 2
      persistence:
        size: 4Gi # for temporary files during processing
