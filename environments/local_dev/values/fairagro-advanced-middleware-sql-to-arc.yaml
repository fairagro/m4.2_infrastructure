# local_dev — kind: local image, no mTLS, Job only
image:
  repository: fairagro-sql-to-arc
  tag: local
  pullPolicy: Never

postgres:
  clusterName: fairagro-postgresql-sql-to-arc
  teamId: fairagro
  user: sqltoarc
  database: rdi
  numberOfInstances: 1
  version: "16"
  volume:
    size: 20Gi

bootstrap:
  enabled: true
  dumpUrl: https://repo.edaphobase.org/rep/dumps/FAIRagro.sql

converter:
  job:
    enabled: true
  cronjob:
    enabled: false

tls:
  enabled: false

config:
  log_level: DEBUG
  rdi: edaphobase
  rdi_url: https://edaphobase.org
  max_concurrent_arc_builds: 2
  connection_string: "postgresql+psycopg://unused:unused@localhost:5432/rdi"
  api_client:
    api_url: "http://fairagro-advanced-middleware-api.fairagro-advanced-middleware.svc.cluster.local:8000"
    timeout: 600
    client_cert_path: null
    client_key_path: null
    verify_ssl: false
  otel:
    endpoint: null
    log_console_spans: false
    log_level: INFO
