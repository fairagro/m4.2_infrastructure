apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fairagro-advanced-middleware-sql-to-arc.configMapName" . }}
  labels:
    {{- include "fairagro-advanced-middleware-sql-to-arc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.yaml: |
    {{- /* Non-secret config; connection_string is overridden via SQL_TO_ARC_CONNECTION_STRING */}}
    {{- toYaml .Values.config | nindent 4 }}
