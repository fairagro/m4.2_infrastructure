fairagro-advanced-middleware-harvester-chart:
  # -- CronJob schedule in standard cron syntax (TZ is controlled by timeZone).
  schedule: "0 2 * * *"

  image:
    # 4.0.0 — fizz trial of current harvester prod release (type-as-key config path).
    tag: 4.0.0

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  config:
    log_level: INFO
    otel:
      endpoint: null
      log_console_spans: false
      log_level: INFO
    api_client:
      api_url: "https://middleware-test.fairagro.net"
      timeout: 30.0
      max_concurrency: 10
      max_retries: 3

  # Enable shared catalog entries (defaults in umbrella chart). openagrar stays off
  # (PoW gate; re-enable with mycore_rest + mods_xml — harvester #523).
  rdi_catalog:
    publisso:
      enabled: true
    bonares:
      enabled: true
      inspire:
        # Test-instance CSW (prod default is repository.zalf.de in chart catalog).
        csw_url: "https://repository-e.dataservice.zalf.de/catalogue/csw"
    thunen_atlas:
      enabled: true
    edal:
      enabled: true
    dwd:
      enabled: true
    sradi:
      enabled: true
    plabipd:
      enabled: true
    phenorob:
      enabled: true
