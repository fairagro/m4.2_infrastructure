fairagro-advanced-middleware-harvester-chart:
  # -- CronJob schedule in standard cron syntax (TZ is controlled by timeZone).
  schedule: "0 2 * * *"

  image:
    # RC: allowed_context_url for jsonld/html_jsonld (#391); enables Publisso
    # regal_find → generic + jsonld. Also: DCAT-AP, pubplant, inspire_general, mycore_solr.
    tag: 3.1.1-rc.issue-391-jsonld-allowed-conte.53

  # =============================================================================
  # Resource requests and limits
  # =============================================================================
  resources:
    requests:
      # -- Baseline CPU needed for a typical harvest run.
      cpu: "100m"
      # -- Baseline memory. The harvester buffers ARC payloads in memory.
      memory: "256Mi"
    limits:
      # -- Upper CPU bound. The harvester is I/O-bound; burst headroom is sufficient.
      cpu: "500m"
      # -- Upper memory bound. Increase if harvesting very large catalogues.
      memory: "1Gi"

  # =============================================================================
  # Harvester configuration — rendered as /etc/harvester/config.yaml
  #
  # This block is serialised to YAML verbatim and stored as a Kubernetes ConfigMap.
  # It contains no sensitive values. Sensitive data (TLS cert content) is
  # managed separately via the tls section below, which creates a K8s Secret.
  # =============================================================================
  config:
    # -- Logging level for the harvester process.
    # -- Allowed: DEBUG | INFO | WARNING | ERROR | CRITICAL
    log_level: INFO

    # -- OpenTelemetry / OTLP settings.
    otel:
      # -- OTLP HTTP collector endpoint. Set null to disable tracing export.
      endpoint: null
      # -- Print every span to stdout (useful for local debugging).
      log_console_spans: false
      # -- Minimum log level exported via OTLP.
      log_level: INFO

    # -- FAIRagro Middleware API client settings.
    api_client:
      # -- Base URL of the Middleware API (no trailing slash).
      # -- Override at runtime via HARVESTER_API_CLIENT__API_URL env var.
      api_url: "https://middleware-test.fairagro.net"
      # -- Request timeout in seconds.
      timeout: 30.0
      # -- Maximum concurrent requests to the API.
      max_concurrency: 10
      # -- Retries for transient HTTP errors (5xx, connection resets).
      max_retries: 3

    # -- List of repositories to harvest. Each entry must specify exactly one
    # -- plugin type (inspire, linked_data, generic, oai_pmh).
    # -- inspire / linked_data / generic / oai_pmh need sibling mapper: { type: ... }
    # -- (and parser for generic / oai_pmh). Prefer nested generic.protocol: { <type>: … }.
    # -- linked_data.payload_type and linked_data mycore_solr are deprecated.
    repositories:

      # PUBLISSO FRL via Regal /find — generic + jsonld with FRL context pin (#391).
      - rdi: publisso
        generic:
          protocol:
            http:
              # FRL robots.txt is Disallow: /; /find is still a public machine API.
              respect_robots_txt: false
            regal_find:
              entry_url: "https://frl.publisso.de/find"
          resource_base_url: "https://repository.publisso.de/resource/"
        parser:
          type: jsonld
          allowed_context_url: "https://frl.publisso.de/context.json"
        mapper:
          type: regal_general

      - rdi: bonares
        inspire:
          csw_url: "https://repository-e.dataservice.zalf.de/catalogue/csw"
        mapper:
          type: inspire_general

      - rdi: thunen_atlas
        inspire:
          csw_url: "https://atlas.thuenen.de/catalogue/csw"
        mapper:
          type: inspire_general

      - rdi: edal
        generic:
          protocol:
            xml:
              entry_url: https://doi.ipk-gatersleben.de/sitemap.xml
        parser:
          type: html_jsonld
          # Live e!DAL pages use http://schema.org; http pin also accepts https.
          allowed_context_url: "http://schema.org"
        mapper:
          type: schema_org_general

      - rdi: dwd
        inspire:
          csw_url: "https://gdk.gdi-de.org/gdi-de/srv/ger/csw"
          # CSW-Abfrage nach DWD Datensaetzen. Die Zahl der Treffer unterscheidet sich von der
          # Web-GUI (https://www.geoportal.de/search.html?q=Deutscher%20Wetterdienst,
          # https://www.geoportal.de/search.html?q=DWD)
          xml_query: |
            <?xml version="1.0" encoding="UTF-8"?>
            <csw:GetRecords
                xmlns:csw="http://www.opengis.net/cat/csw/2.0.2"
                xmlns:ogc="http://www.opengis.net/ogc"
                service="CSW"
                version="2.0.2"
                resultType="results"
                outputFormat="application/xml"
                outputSchema="http://www.isotc211.org/2005/gmd">

                <csw:Query typeNames="csw:Record">
                  <csw:ElementSetName>full</csw:ElementSetName>
                  <csw:Constraint version="1.1.0">
                    <ogc:Filter>
                      <ogc:And>
                        <ogc:Or>
                          <ogc:PropertyIsLike wildCard="%" singleChar="_" escapeChar="\">
                            <ogc:PropertyName>Identifier</ogc:PropertyName>
                            <ogc:Literal>urn:x-wmo:md:de.dwd.cdc::%</ogc:Literal>
                          </ogc:PropertyIsLike>
                          <ogc:PropertyIsLike wildCard="%" singleChar="_" escapeChar="\">
                            <ogc:PropertyName>Identifier</ogc:PropertyName>
                            <ogc:Literal>urn:wmo:md:de-dwd%</ogc:Literal>
                          </ogc:PropertyIsLike>
                          <ogc:PropertyIsLike wildCard="%" singleChar="_" escapeChar="\">
                            <ogc:PropertyName>Identifier</ogc:PropertyName>
                            <ogc:Literal>de.dwd.geoserver.%</ogc:Literal>
                          </ogc:PropertyIsLike>
                          <ogc:PropertyIsLike wildCard="%" singleChar="_" escapeChar="\">
                            <ogc:PropertyName>Identifier</ogc:PropertyName>
                            <ogc:Literal>de.dwd.vorhersage.%</ogc:Literal>
                          </ogc:PropertyIsLike>
                        </ogc:Or>
                        <ogc:PropertyIsEqualTo>
                          <ogc:PropertyName>Type</ogc:PropertyName>
                          <ogc:Literal>dataset</ogc:Literal>
                        </ogc:PropertyIsEqualTo>
                      </ogc:And>
                    </ogc:Filter>
                  </csw:Constraint>
                </csw:Query>

            </csw:GetRecords>
        mapper:
          type: inspire_general

      - rdi: openagrar
        # Canonical MyCoRe Solr discovery via generic (PR #385).
        # Keep the OpenAgrar research-data filter on entry_url — defaults would be q=*:* .
        generic:
          protocol:
            http:
              # OpenAgrar robots.txt Disallow: /servlets/ blocks Solr; M2M harvest needs this.
              respect_robots_txt: false
            mycore_solr:
              entry_url: >-
                https://www.openagrar.de/servlets/solr/select?core=main&q=category.top%3A%22mir_genres%3Aresearch_data%22+AND+objectType%3Amods+AND+category.top%3A%22state%3Apublished%22&fl=id
              page_size: 1000  # was rows=1000 on the legacy linked_data URL
        parser:
          type: html_jsonld
          allowed_context_url: "http://schema.org"
        mapper:
          type: schema_org_general

      # SRADI — DCAT-AP / ckanext-dcat (PR #359, m4_rdi_portfolio#8)
      # Expanded DCAT-AP payloads typically have no remote @context — leave pin unset.
      - rdi: sradi
        generic:
          protocol:
            dcat_ap:
              entry_url: "https://agrihub.gis.lrg.tum.de/catalog.jsonld"
        parser:
          type: jsonld
        mapper:
          type: ckanext_dcat
          catalog_name: "Smart Rural Areas Data Infrastructure (SRADI)"
          catalog_url: "https://agrihub.gis.lrg.tum.de"

      # PlabiPD / PubPlant genomes.json (PR #360, m4_rdi_portfolio#7)
      - rdi: plabipd
        generic:
          protocol:
            pubplant_json_array:
              entry_url: "https://raw.githubusercontent.com/usadellab/pubplant2schemaorg/gh-pages/genomes.json"
        parser:
          type: jsonld
          # Exact IRI from genomes.json records (no trailing slash).
          allowed_context_url: "http://schema.org"
        mapper:
          type: schema_org_general

      - rdi: phenorob
        oai_pmh:
          endpoint_url: "https://phenoroam.phenorob.de/geonetwork/srv/eng/oaipmh"
          metadata_prefix: phenoroam
        parser:
          type: phenoroam_xml
        mapper:
          type: phenoroam_general
