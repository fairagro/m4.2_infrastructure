# Gate: environments/draven/values must not pin product pre-releases.
# Always runs on PRs to main (required-check friendly; script no-ops cleanly when OK).
# Also callable before infra SemVer tags (#42) via workflow_call / workflow_dispatch.
name: check-draven-pins

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check-draven-release-pins:
    name: check-draven-release-pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject pre-release image pins under environments/draven/values
        run: ./scripts/check_draven_release_pins.sh
