# Infra SemVer release for draven (Argo targetRevision: '*').
# Thin MVP (#42): manual bump + Soft fizz checkbox + draven pin gate → tag + GitHub Release.
# Does not rewrite Application YAML or env values (golden rule).
name: release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type (only allowed on main)
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      fizz_validated:
        description: Soft attestation — relevant product changes were validated on fizz
        required: true
        type: boolean
        default: false

# Shared with release-rollback so forward + rollback cannot race SemVer tags (#57).
concurrency:
  group: infra-semver-tag
  cancel-in-progress: false

# Least privilege: read at workflow scope; write only on the job that tags/releases.
permissions:
  contents: read

jobs:
  release:
    name: Validate then tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Assert main branch
        run: |
          if [[ "${{ github.ref_name }}" != "main" ]]; then
            echo "::error::The Release workflow can only be triggered from the 'main' branch."
            exit 1
          fi

      - name: Assert Soft fizz attestation
        run: |
          if [[ "${{ inputs.fizz_validated }}" != "true" ]]; then
            echo "::error::Soft fizz attestation required: set 'fizz_validated' to true after validating on fizz."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}

      - name: Reject pre-release image pins under environments/draven/values
        run: ./scripts/check_draven_release_pins.sh

      - name: Compute next SemVer
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          # Orphan-tag retry: if this commit already has a plain SemVer tag, finish that
          # release instead of bumping past it (tag push succeeded, gh release create failed).
          existing_at_sha="$(
            git tag -l --points-at "${GITHUB_SHA}" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n1 \
            || true
          )"
          if [[ -n "${existing_at_sha}" ]]; then
            next="${existing_at_sha}"
            echo "Reusing existing tag ${next} at this commit (idempotent release path)."
          else
            next="$(./scripts/compute_next_infra_semver.sh "${{ inputs.version_bump }}")"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          # Prior plain SemVer tag (strictly below next) for compare URL / notes
          prior="$(
            git tag -l --sort=-v:refname \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -vxF "${next}" \
              | head -n1 \
            || true
          )"
          echo "prior=${prior}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next} (bump=${{ inputs.version_bump }}, prior=${prior:-none})"

      - name: Create annotated tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRIOR: ${{ steps.version.outputs.prior }}
          BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          remote_tag_sha="$(git ls-remote --tags --refs origin "refs/tags/${VERSION}" | awk '{print $1}')"
          if [[ -n "${remote_tag_sha}" ]]; then
            if [[ "${remote_tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "::error::Tag ${VERSION} already exists at ${remote_tag_sha}, not at this commit ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${VERSION} already points at this commit; skipping tag create/push."
          else
            if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
              echo "::error::Local tag ${VERSION} exists but is missing on origin; resolve manually."
              exit 1
            fi
            git tag -a "${VERSION}" -m "infra release ${VERSION} (${BUMP})"
            git push origin "refs/tags/${VERSION}"
          fi

          notes_file="$(mktemp)"
          {
            echo "## Infra release \`${VERSION}\`"
            echo
            echo "- **Bump:** \`${BUMP}\`"
            echo "- **Soft fizz attestation:** operator confirmed relevant changes were validated on fizz (honor-system; no lineage check)."
            echo "- **Draven pins:** \`scripts/check_draven_release_pins.sh\` passed on this commit."
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo
            echo "Tags SHOULD be created only via Actions workflows **release** or **release-rollback** (Ruleset enforcement may follow)."
            echo "Content rollback: Actions → **release-rollback** (#57). Cluster emergency pin: docs/ops/emergency-pin.md (#68)."
            if [[ -n "${PRIOR}" && "${PRIOR}" != "${VERSION}" ]]; then
              echo
              echo "Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${PRIOR}...${VERSION}"
            fi
          } >"${notes_file}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release ${VERSION} already exists; leaving notes unchanged."
          else
            gh release create "${VERSION}" \
              --title "infra ${VERSION}" \
              --notes-file "${notes_file}" \
              --target "${GITHUB_SHA}"
          fi
