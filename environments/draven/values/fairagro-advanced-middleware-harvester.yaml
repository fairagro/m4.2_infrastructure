fairagro-advanced-middleware-harvester-chart:
  # -- CronJob schedule in standard cron syntax (TZ is controlled by timeZone).
  schedule: "0 2 * * *"

  image:
    # 4.0.0 — promote validated fizz harvester release (type-as-key config path).
    tag: 4.0.0

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  config:
    log_level: INFO
    otel:
      endpoint: http://signoz-otel-collector.monitoring.svc.draven.cluster:4318
      log_console_spans: false
      log_level: INFO
    api_client:
      api_url: "https://middleware.fairagro.net"
      timeout: 30.0
      max_concurrency: 10
      max_retries: 3

  # Production portfolio. Catalog bodies live in the umbrella chart; openagrar off
  # until mycore_rest + mods_xml (harvester #523).
  rdi_catalog:
    publisso:
      enabled: true
    bonares:
      enabled: true
      inspire:
        csw_url: "https://repository.zalf.de/catalogue/csw"
    thunen_atlas:
      enabled: true
    edal:
      enabled: true
    dwd:
      enabled: true
    sradi:
      enabled: true
    plabipd:
      enabled: true
    phenorob:
      enabled: true
