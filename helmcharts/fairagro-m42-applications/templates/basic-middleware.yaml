{{- if .Values.basic_middleware_revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basic-middleware
  namespace: fairagro-m42-applications
spec:
  project: fairagro-m42
  sources:
    - repoURL: https://github.com/fairagro/m4.2_infrastructure.git
      path: helmcharts/fairagro-basic-middleware
      targetRevision: "{{ .Values.basic_middleware_revision }}"
      helm:
        valueFiles:
          - $values/environments/{{ .Values.cluster_name }}/values/fairagro-basic-middleware.yaml
          - $values/environments/{{ .Values.cluster_name }}/values/fairagro-basic-middleware.enc.yaml
    - repoURL: https://github.com/fairagro/m4.2_infrastructure.git
      targetRevision: "{{ .Values.basic_middleware_revision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: fairagro-basic-middleware
  syncPolicy:
    syncOptions:
      - Prune=true
{{- end }}
