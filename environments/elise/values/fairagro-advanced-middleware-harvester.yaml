fairagro-advanced-middleware-harvester-chart:
  # CronJob schedule (TZ controlled by timeZone).
  schedule: "0 2 * * *"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  config:
    log_level: INFO
    otel:
      endpoint: null
      log_console_spans: false
      log_level: INFO
    api_client:
      api_url: https://middleware-dev.fairagro.net
      timeout: 30.0
      max_concurrency: 10
      max_retries: 3
  rdi_catalog:
    bonares:
      enabled: true
      inspire:
        # Staging CSW for elise.
        csw_url: https://repository-staging.dataservice.zalf.de/catalogue/csw
    # Intentional behaviour change vs pre-migration legacy schema_org block:
    # enable modern catalog shape (generic + html_jsonld + schema_org_general),
    # aligned with fizz/draven.
    edal:
      enabled: true
