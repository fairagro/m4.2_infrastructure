{{- if .Values.advanced_middleware_sql_to_arc_revision }}
{{- $rev := include "fairagro-m42-applications.childRevision" (dict "root" . "key" "advanced_middleware_sql_to_arc_revision") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fairagro-advanced-middleware-sql-to-arc
  namespace: fairagro-m42-applications
spec:
  project: fairagro-m42
  sources:
    - repoURL: https://github.com/fairagro/m4.2_infrastructure.git
      path: helmcharts/fairagro-advanced-middleware-sql-to-arc
      targetRevision: "{{ $rev }}"
      helm:
        valueFiles:
          - $values/environments/{{ .Values.cluster_name }}/values/fairagro-advanced-middleware-sql-to-arc.yaml
          - $values/environments/{{ .Values.cluster_name }}/values/fairagro-advanced-middleware-sql-to-arc.enc.yaml
    - repoURL: https://github.com/fairagro/m4.2_infrastructure.git
      targetRevision: "{{ $rev }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: fairagro-advanced-middleware-sql-to-arc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Prune=true
{{- end }}
