fairagro-advanced-middleware-api-chart:
  config:
    log_level: DEBUG
    known_rdis:
      - aeprints
      - bonares
      - bonares_klib
      - dwd
      - edal
      - edaphobase
      - gbis
      - jki_datacube
      - openagrar
      - phenorob
      - plabipd
      - publisso
      - sradi
      - thunen_atlas
    # Dual-slot ArcStore (issue #517 hard cut):
    # - required arc_store: per-ARC git_repo (backend selected by nested key, no type)
    # - optional consolidated_store: shared catalog repo
    # Tokens: fairagro-advanced-middleware.enc.yaml →
    #   arc_store.git.token + consolidated_store.git.token
    arc_store:
      git:
        max_workers: 4
      git_repo:
        url: https://datahub.ipk-gatersleben.de
        group: FAIRagro-advanced-middleware-test
        rdi_gitlab_topics:
          aeprints: "AGROECOLOGY EPrints"
          bonares: bonares
          bonares_klib: "Bonares Knowledge Library"
          dwd: DWD
          edal: "e!DAL"
          edaphobase: edaphobase
          gbis: GBIS
          jki_datacube: "JKI Datacube"
          openagrar: "OpenAgrar Repository"
          phenorob: PhenoRob
          plabipd: PLABIPD
          publisso: Publisso
          sradi: SRADI
          thunen_atlas: "Thunen Atlas"
    consolidated_store:
      git:
        max_workers: 4
      consolidated_git:
        repo_url: https://datahub.ipk-gatersleben.de/fairagro-advanced-middleware-basic-layout-test/middleware_repo.git
    celery: {}  # all further celery config is set via environment variables
    otel:
      endpoint: http://signoz-otel-collector.monitoring.svc.fizz.cluster:4318
      log_level: DEBUG

  rabbitmq:
    image: rabbitmq:4.3.4-alpine

  couchdb:
    image: couchdb:3.5.2.1
    persistence:
      enabled: true
      size: 5Gi

  api:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
    ingress:
      enabled: true
      mtlsEnabled: true
      mtlsVerifyDepth: 3
      className: nginx-external
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: 32m
        cert-manager.io/issuer: letsencrypt
        cert-manager.io/private-key-size: "4096"
        cert-manager.io/private-key-rotation-policy: "Always"
        # It seems the subjects annotations do not have any effect.
        # Still we keep them...
        cert-manager.io/subject-countries: "DE"
        cert-manager.io/subject-organizations: "NFDI FAIRagro"
        cert-manager.io/subject-organizationalunits: "Measure 4.2"
      hosts:
        - host: middleware-test.fairagro.net
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - secretName: server-tls
          hosts:
            - middleware-test.fairagro.net

  celery:
    image:
      repository: zalf/fairagro-advanced-middleware-api
      tag: 14.0.1-rc.issue-258-embed-rdi-comments.49
    worker:
      replicaCount: 2
      concurrency: 2
      persistence:
        size: 4Gi # for temporary files during processing
