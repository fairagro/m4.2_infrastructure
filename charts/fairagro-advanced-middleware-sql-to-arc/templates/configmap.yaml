apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fairagro-advanced-middleware-sql-to-arc.configMapName" . }}
  labels:
    {{- include "fairagro-advanced-middleware-sql-to-arc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  config.yaml: |
    {{- /* Non-secret config only; DB URL is chart env SQL_TO_ARC_CONNECTION_STRING */}}
    {{- toYaml (omit .Values.config "connection_string") | nindent 4 }}
